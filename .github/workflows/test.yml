name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Run tests
        run: make test
