[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buddy-scheduler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.7",
    "click>=8.1",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pydantic>=2.0",
    "filelock>=3.12",
]

[project.scripts]
buddy-scheduler = "buddy_scheduler.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-psutil>=7.2.2.20260130",
    "hypothesis>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/buddy_scheduler"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A", "C4", "RET", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["buddy_scheduler"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests",
    "benchmark: performance benchmarks",
]
addopts = "-m 'not slow'"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "pulp.*"
ignore_missing_imports = true


[tool.coverage.run]
source = ["buddy_scheduler"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
